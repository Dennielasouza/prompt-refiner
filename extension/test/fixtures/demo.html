<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Refiner — demo</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #272b35;
      --text: #e7e9ee;
      --muted: #8b90a0;
      --accent: #6c8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    .app { width: 760px; }
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 14px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #3a3f4b; }
    .dot:first-child { background: #ff5f57; }
    .dot:nth-child(2) { background: #febc2e; }
    .dot:nth-child(3) { background: #28c840; }
    .bar span { margin-left: 10px; }
    .composer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 18px 14px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
    }
    textarea {
      width: 100%;
      min-height: 150px;
      resize: none;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--text);
      font: inherit;
    }
    textarea::placeholder { color: var(--muted); }
    textarea::selection { background: #3b4a86; }
    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .send {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 8px 18px;
      font: inherit;
      font-weight: 600;
    }
    .hint { margin-top: 18px; text-align: center; color: var(--muted); font-size: 13px; }
    kbd {
      background: #222631;
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 1px 7px;
      font: inherit;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="bar">
      <i class="dot"></i><i class="dot"></i><i class="dot"></i>
      <span>Nova conversa</span>
    </div>
    <div class="composer">
      <textarea id="composer" placeholder="Escreva do jeito que você pensa…"></textarea>
      <div class="foot">
        <span>Seu assistente de IA</span>
        <button class="send" type="button">Enviar</button>
      </div>
    </div>
    <p class="hint">Selecione o texto → botão direito → <b>Refinar prompt</b>, ou <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd></p>
  </div>
</body>
</html>
