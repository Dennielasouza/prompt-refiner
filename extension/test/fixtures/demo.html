<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Refiner — demo</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #151922;
      --border: #262c38;
      --text: #e9ecf2;
      --muted: #8a92a6;
      --accent: #6c8cff;
      --accent-soft: #2a3566;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(900px 500px at 50% -10%, #1a2140 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    .app { width: 820px; }

    .bar { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #393f4c; }
    .dot:first-child { background: #ff5f57; }
    .dot:nth-child(2) { background: #febc2e; }
    .dot:nth-child(3) { background: #28c840; }
    .bar span { margin-left: 10px; letter-spacing: .2px; }

    .composer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 20px 14px;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
      transition: border-color .25s, box-shadow .25s;
    }
    .composer.ativo {
      border-color: var(--accent);
      box-shadow: 0 24px 60px rgba(0,0,0,.5), 0 0 0 4px rgba(108,140,255,.14);
    }
    textarea {
      width: 100%; min-height: 168px; resize: none; background: transparent;
      border: 0; outline: 0; color: var(--text); font: inherit;
    }
    textarea::placeholder { color: var(--muted); }
    textarea::selection { background: #3a4a8f; }
    .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; color: var(--muted); font-size: 13px; }
    .send { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 9px 20px; font: inherit; font-weight: 600; }

    .atalhos { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
    .atalho {
      display: flex; align-items: center; gap: 9px;
      border: 1px solid var(--border); border-radius: 12px;
      padding: 9px 14px; color: var(--muted); font-size: 13.5px;
      background: rgba(21,25,34,.6);
      transition: all .3s;
    }
    .atalho.on {
      color: #fff; border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 4px rgba(108,140,255,.12);
      transform: translateY(-2px);
    }
    kbd {
      background: #202633; border: 1px solid #333c4d; border-bottom-width: 2px;
      border-radius: 6px; padding: 2px 8px; font: inherit; font-size: 12.5px; color: inherit;
    }
    .atalho.on kbd { background: #39477f; border-color: #5168c4; }
    .onde { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="bar">
      <i class="dot"></i><i class="dot"></i><i class="dot"></i>
      <span>Nova conversa</span>
    </div>

    <div class="composer" id="composer-box">
      <textarea id="composer" placeholder="Escreva do jeito que você pensa…"></textarea>
      <div class="foot">
        <span>Seu assistente de IA</span>
        <button class="send" type="button">Enviar</button>
      </div>
    </div>

    <div class="atalhos">
      <div class="atalho" id="a-menu"><span>Botão direito</span><kbd>Refinar prompt</kbd></div>
      <div class="atalho" id="a-tecla"><kbd>Alt</kbd><kbd>Shift</kbd><kbd>R</kbd></div>
      <div class="atalho" id="a-mac"><kbd>⌥</kbd><kbd>⌥</kbd><span>em qualquer app do Mac</span></div>
    </div>
    <p class="onde">Três formas de acionar. O texto é substituído ali mesmo, onde você escreve.</p>
  </div>

  <script>
    // Realce visual usado só na gravação do GIF. Não aciona nada: quem refina é a extensão.
    window.__destacar = (id) => {
      for (const el of document.querySelectorAll(".atalho")) el.classList.remove("on");
      if (id) document.getElementById(id).classList.add("on");
    };
    window.__focar = (on) => document.getElementById("composer-box").classList.toggle("ativo", !!on);
  </script>
</body>
</html>
