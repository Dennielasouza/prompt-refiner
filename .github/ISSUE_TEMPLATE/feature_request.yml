name: Feature request
description: Suggest an improvement or a new destination.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: What are you trying to do that is awkward or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you already tried, or alternatives you considered?
